function gradientNoise(x,y,scale,seed){

function mapAppearance(){const a=model().appearance;function change(m){const d=num('density');if(!Number.isFinite(d)||d<0||d>100)return false;m.appearance={...m.appearance,contours:$('contours').value,density:d,family:$('map-family').value,title:$('map-title').value.trim()||'The Map Room',subtitle:$('map-subtitle').value.trim(),ornament:$('map-ornament').value,frame:$('map-frame').value,labels:$('map-labels').value,marks:$('map-marks').value}}openPane('Map appearance',()=>{group('Chart',()=>{field('Title','map-title',a.title).maxLength=80;field('Subtitle (optional)','map-subtitle',a.subtitle).maxLength=120;field('Chart ornament','map-ornament',a.ornament,[['none','None'],['family','Family emblem'],['compass','Compass rose']]);familySelect('Decorative family','map-family',a.family,false)});group('Background',()=>{field('Contours','contours',a.contours,[['none','None'],['subtle','Subtle'],['engraved','Engraved']]);const el=field('Density','density',a.density,null,'number');el.min=0;el.max=100});group('Room defaults',()=>{field('Boundary detail','map-frame',a.frame,mapFrames);field('Inscriptions','map-labels',a.labels,mapLabels);field('Family marks','map-marks',a.marks,mapMarks)});note('Map-only display defaults. Each Room may override them; physical boundaries, connections and interior profiles are unchanged.');liveAppearance(change)},()=>{const m=cp(model());if(change(m)===false){status('Density must be 0–100.',true);return false}return edit(q=>{q.appearance=m.appearance})})}
function gridEditor(){openPane('Grid and snapping',()=>{field('Show grid','g-visible',grid,null,'checkbox');field('Snap increments','g-snap',snap,null,'checkbox');field('Magnetic walls','g-magnet',magnet,null,'checkbox');field('Interval','g-step',interval,null,'number');note('Grid and snapping are independent. Numeric dimensions ignore snapping.');},()=>{let n=num('g-step');if(!Number.isFinite(n)||n<5||n>200){status('Interval must be 5–200.',true);return false}grid=$('g-visible').checked;snap=$('g-snap').checked;magnet=$('g-magnet').checked;interval=n;render();return true})}
function addRoom(p){begin();if(pending)return;const m=model(),w=600,h=440,step=interval,origin={x:snap?Math.round((p.x-w/2)/step)*step:p.x-w/2,y:snap?Math.round((p.y-h/2)/step)*step:p.y-h/2};let options=[origin];for(let ring=1;ring<=12;ring++){for(let i=-ring;i<=ring;i++){options.push({x:origin.x+i*w/2,y:origin.y-ring*h/2},{x:origin.x+i*w/2,y:origin.y+ring*h/2});if(Math.abs(i)<ring)options.push({x:origin.x-ring*w/2,y:origin.y+i*h/2},{x:origin.x+ring*w/2,y:origin.y+i*h/2})}}options.sort((a,b)=>Math.hypot(a.x-origin.x,a.y-origin.y)-Math.hypot(b.x-origin.x,b.y-origin.y));const place=options.find(q=>m.rooms.every(r=>!overlap({...q,w,h},r)));if(!place){status('No free space near this point. Pan to a clear area and try again.',true);return}const id='room-'+m.next;if(edit(q=>{q.rooms.push(room(id,'New Room','',place.x,place.y,w,h,[]));q.next++})){focusTarget({kind:'room',id});status('New Room placed. Drag or resize it; use Appearance to rename.')}}
function doorEditor(id){begin();const d=door(model(),id);if(!d)return;const a=find(model(),d.a),b=find(model(),d.b),c=common(a,b);openPane('Shared doorway',()=>{note(a.name+' ↔ '+b.name);field('Position along wall','d-at',d.at,null,'number');field('Width','d-w',d.w,null,'number');note(`Shared wall: ${c.lo}–${c.hi}. Both Room openings use this same doorway. Position uses map coordinates.`)},()=>{const ok=edit(m=>{let d=door(m,id);d.at=num('d-at');d.w=num('d-w')});if(ok)status('Both Room openings updated.');return ok})}
function addDoor(id){begin();const r=find(model(),id),neighbors=model().rooms.filter(b=>b.id!==id&&common(r,b));if(!neighbors.length){status('Move a Room against another Room before connecting.',true);return}openPane('Connect Rooms',()=>{field('Adjacent Room','d-neighbor',neighbors[0].id,neighbors.map(b=>[b.id,b.name]));field('Position along wall','d-at',0,null,'number');field('Width','d-w',100,null,'number');const reset=()=>{const c=common(r,find(model(),$('d-neighbor').value));let d={id:'trial',a:id,b:$('d-neighbor').value,axis:c.axis,at:(c.lo+c.hi)/2,w:100},q=nearestDoor(model(),d,d.at)||nearestDoor(model(),{...d,w:60},d.at,60);let chosen=q?.at??d.at;$('d-w').value=q?.w??100;$('d-at').value=chosen};$('d-neighbor').onchange=reset;reset();note('A connection is a single shared opening. More than one doorway may fit a shared wall.');},()=>{const ok=edit(m=>{const b=$('d-neighbor').value,c=common(find(m,id),find(m,b));m.doors.push({id:'door-'+m.nextDoor++,a:id,b,axis:c.axis,at:num('d-at'),w:num('d-w')})});if(ok)status('Shared doorway added.');return ok})}
function disconnect(id){if(inside||pending||gesture||!closePane())return;begin();if(!door(model(),id))return;const before=cp(draft);if(edit(m=>{m.doors=m.doors.filter(d=>d.id!==id)})){rememberDoorEdit(before);clearFocus();status('Doorway removed from both Rooms. Undo restores it.')}}
function removeRoom(id){begin();const r=find(model(),id);if(model().rooms.length===1||r.shelves.length||model().doors.some(d=>d.a===id||d.b===id)){status('Only empty, disconnected Rooms can be removed in this study. Resolve contents/connections first.',true);return}openPane('Remove empty Room',()=>{note('Remove '+r.name+' from the map?');action('Remove Room',()=>{edit(m=>{m.rooms=m.rooms.filter(r=>r.id!==id)});closePane(true);clearFocus()})},null)}
function menu(items,title,x,y){closeMenu();const el=$('menu');el.replaceChildren();let h=document.createElement('div');h.id='menuTitle';h.textContent=title;el.append(h);for(const [s,fn,disabled] of items){let b=document.createElement('button');b.setAttribute('role','menuitem');b.textContent=s;b.disabled=!!disabled;b.onclick=()=>{closeMenu();fn()};el.append(b)}el.hidden=false;$('mainMenu').setAttribute('aria-expanded','true');let b=el.getBoundingClientRect();el.style.left=clamp(x,4,Math.max(4,innerWidth-b.width-4))+'px';el.style.top=clamp(y,4,Math.max(4,innerHeight-b.height-4))+'px';el.querySelector('button:not(:disabled)')?.focus({preventScroll:true})}
function rootMenu(x,y,p){menu([['Appearance…',mapAppearance],['Add Room…',()=>addRoom(p)],['Grid and snapping…',gridEditor],['Fit map',fit],['Undo',undo,!history.length&&!draft]],'Map Room',x,y)}
function roomMenu(id,x,y){const items=[['Appearance…',()=>roomEditor(id)],['Dimensions…',()=>roomEditor(id,true)],['Connect doorway…',()=>addDoor(id)],['Remove empty Room…',()=>removeRoom(id)],['Enter Room',()=>{if(commit())enter(id)}]];menu(draft?[items[1],items[2],items[3],items[0]]:items,find(model(),id).name,x,y)}
function doorMenu(id,x,y){menu([['Position and width…',()=>doorEditor(id)],['Remove doorway',()=>disconnect(id)]],'Shared doorway',x,y)}
function rememberDoorEdit(before){if(draft)doorwayUndo.push({before:cp(before),after:JSON.stringify(draft)})}
function undo(){if(pending){resolveChange(false);return}if(!closePane())return;if(draft){const step=doorwayUndo.at(-1);if(step&&step.after===JSON.stringify(draft)){draft=step.before;doorwayUndo.pop();clearFocus(false);status('Doorway edit undone.');return}doorwayUndo=[];draft=cp(saved);clearFocus(false);status('Uncommitted arrangement restored.');return}if(history.length){saved=history.pop();selected=null;render();status('Previous map state restored.')}}
function enter(id){if(draft||inside||!closePane())return;returnView=cp(view);inside=id;selected=null;fit();status('Individual Room reference · shared wall openings use the same connection data.');}
function back(){if(!inside)return;inside=null;view=returnView;returnView=null;render();status('Returned to the original map view.')}
function target(e){let a=e.target.closest('[data-suggest]'),r=e.target.closest('[data-room]'),d=e.target.closest('[data-door]'),z=e.target.closest('[data-resize]');return a?{kind:'suggest',id:a.dataset.suggest}:d?{kind:'door',id:d.dataset.door,handle:d.dataset.handle||'move'}:z?{kind:'resize',id:z.dataset.resize,handle:z.dataset.handle.slice(7)}:r?{kind:'room',id:r.dataset.room}:null}
svg.addEventListener('contextmenu',e=>{e.preventDefault();if(inside||pending||!closePane())return;let t=target(e);if(t?.kind==='suggest'){acceptSuggestion(t.id);return}if(t?.kind==='door')doorMenu(t.id,e.clientX,e.clientY);else if(t)roomMenu(t.id,e.clientX,e.clientY);else rootMenu(e.clientX,e.clientY,point(e))});
svg.addEventListener('pointerdown',e=>{if(e.button!==0||pending||!closePane())return;stopFlight();closeMenu();$('tip').hidden=true;const t=target(e),p=point(e);gesture={t,p,view:cp(view),client:[e.clientX,e.clientY],base:cp(model()),moved:false,lost:[],shifted:0};if(draft&&t&&!inside&&t.kind!=='suggest'){selected={kind:t.kind==='resize'?'room':t.kind,id:t.id};render()}svg.focus({preventScroll:true});svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!gesture)return;const g=gesture;if(Math.hypot(e.clientX-g.client[0],e.clientY-g.client[1])<4&&!g.moved)return;g.moved=true;const p=point(e),dx=p.x-g.p.x,dy=p.y-g.p.y,round=v=>snap?Math.round(v/interval)*interval:v;const t=g.t;if(!t||inside||!draft){if(t&&!inside)return;const b=viewport();view={...g.view,x:g.view.x-(e.clientX-g.client[0])*g.view.w/b.w,y:g.view.y-(e.clientY-g.client[1])*g.view.h/b.h};render();return}if(t.kind==='suggest')return;let m=cp(g.base),result={lost:[],shifted:0};guide=null;if(t.kind==='door'){const d=door(m,t.id),delta=round(d.axis==='v'?dy:dx),q=manipulateDoor(m,t.id,t.handle,delta);if(!q){status('This opening cannot move further here.',true);return}m=q.model;g.merged=q.merged;g.clamped=q.clamped}else{let r=find(m,t.id);if(t.kind==='resize'){let h=t.handle;if(h.includes('e'))r.w+=round(dx);if(h.includes('s'))r.h+=round(dy);if(h.includes('w')){r.x+=round(dx);r.w-=round(dx)}if(h.includes('n')){r.y+=round(dy);r.h-=round(dy)}}else{r.x+=round(dx);r.y+=round(dy)}guide=magnetic(m,t.id,t.kind==='resize',t.handle);result=reconcile(m,t.id)}let err=valid(m);if(err){status(err,true);return}draft=m;g.lost=result.lost;g.shifted=result.shifted;render();status(g.merged?.length?`Merge preview · ${g.merged.length+1} doorways become one · release to keep.`:g.clamped?'Opening at clear wall limit.':result.lost.length?`${result.lost.length} doorway(s) would disconnect on this move.`:result.shifted?'Doorways adjusted to clear shared wall.':guide?'Walls aligned · click + to add a doorway.':'Valid provisional geometry.');});
svg.addEventListener('pointerup',e=>{let g=gesture;gesture=null;if(!g)return;if(g.moved&&g.lost.length){pendingChange(g.base,g.lost);return}if(g.moved&&g.merged?.length){rememberDoorEdit(g.base);status('Doorways merged. Undo restores the separate openings.');render();return}if(!g.moved&&!draft&&!inside&&g.t?.kind==='room')enter(g.t.id);else if(!g.moved&&draft){if(g.t?.kind==='suggest')acceptSuggestion(g.t.id);else if(g.t)focusTarget({kind:g.t.kind==='resize'?'room':g.t.kind,id:g.t.id});else clearFocus()}else render()});
svg.addEventListener('pointercancel',()=>{if(gesture&&draft)draft=gesture.base;gesture=null;guide=null;render()});
svg.addEventListener('wheel',e=>{e.preventDefault();if(gesture)return;zoom(Math.exp(clamp(e.deltaY,-200,200)*.002),point(e))},{passive:false});
svg.addEventListener('pointerover',e=>{if(gesture||flight)return;let t=target(e);if(!t||t.kind==='suggest')return;const r=find(model(),t.id),d=door(model(),t.id);$('tip').textContent=r?`${r.name} · ${r.w} × ${r.h} · ${r.shelves.length} Shelves · ${r.family==='inherit'?'Inherited: '+families[model().appearance.family]:families[r.family]}`:d?`${find(model(),d.a).name} ↔ ${find(model(),d.b).name} · width ${d.w}`:'';$('tip').hidden=false;$('tip').style.left=clamp(e.clientX+12,6,innerWidth-280)+'px';$('tip').style.top=clamp(e.clientY+14,6,innerHeight-70)+'px'});svg.addEventListener('pointerout',()=>{$('tip').hidden=true});
svg.addEventListener('keydown',e=>{const t=target(e);if(!t||inside||pending)return;if(t.kind==='suggest'&&['Enter',' '].includes(e.key)){e.preventDefault();acceptSuggestion(t.id);return}if(e.key==='ContextMenu'||e.shiftKey&&e.key==='F10'){e.preventDefault();const r=e.target.getBoundingClientRect();if(t.kind==='door')doorMenu(t.id,r.x,r.y);else roomMenu(t.id,r.x,r.y)}else if(['Enter',' '].includes(e.key)){e.preventDefault();if(draft){focusTarget(t);svg.querySelector(`[data-${t.kind==='door'?'door':'room'}="${t.id}"]`)?.focus({preventScroll:true})}else if(t.kind==='room')enter(t.id)}});
$('mainMenu').onclick=e=>{if(pending||!closePane())return;let b=e.target.getBoundingClientRect();rootMenu(b.left,b.bottom+4,{x:view.x+view.w*.22,y:view.y+view.h*.72})};$('mode').onclick=()=>{if(!closePane())return;if(draft)commit();else begin()};$('close').onclick=()=>closePane();$('roomBack').onclick=back;$('theme').onchange=()=>{theme();render()};$('detail').onchange=render;$('plus').onclick=()=>zoom(.75);$('minus').onclick=()=>zoom(1/.75);$('fit').onclick=fit;$('focusBack').onclick=()=>{if(!pending&&closePane())clearFocus()};$('keepMove').onclick=()=>resolveChange(true);$('restoreMove').onclick=()=>resolveChange(false);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#mainMenu'))closeMenu();if(panel&&!e.target.closest('#pane,#map,#mode,#mainMenu,#close')&&!closePane())e.preventDefault()});document.addEventListener('keydown',e=>{if(['Delete','Backspace'].includes(e.key)&&draft&&!inside&&!pending&&!gesture&&!panel&&$('menu').hidden&&selected?.kind==='door'&&!e.target.closest?.('input,textarea,select,[contenteditable]')){e.preventDefault();disconnect(selected.id);return}if(e.key==='Escape'){if(pending)resolveChange(false);else if(!$('menu').hidden)closeMenu();else if(panel)closePane(true);else if(inside)back();else if(draft){draft=null;doorwayUndo=[];clearFocus(false);status('Arrangement discarded.')} }if(e.key==='Enter'&&panel&&e.target.matches('input')){e.preventDefault();closePane()}});
new ResizeObserver(()=>{if(gesture||flight)return;const p=viewport(),h=view.w*p.h/p.w;view.y+=(view.h-h)/2;view.h=h;render()}).observe(svg);
window.__mapStudy={state:()=>cp({saved,draft,selected,inside,view,grid,snap,interval,magnet,focusView,pending,flight:!!flight}),valid,common,openings:id=>cp(roomOpenings(model(),find(model(),id))),model:()=>cp(model()),wallPath,fit,zoom,doorRanges,proposals,manipulateDoor};theme();fit();
