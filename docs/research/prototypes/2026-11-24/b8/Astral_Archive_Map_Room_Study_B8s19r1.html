let saved=cp(initial),draft=null,history=[],selected=null,inside=null,returnView=null,gesture=null,panel=null,preview=null,menuAnchor=null,grid=true,snap=true,interval=20,view={x:-100,y:-100,w:2200,h:1650};
const model=()=>preview||draft||saved,find=(m,id)=>m.rooms.find(r=>r.id===id),door=(m,id)=>m.doors.find(d=>d.id===id),dims=r=>({x:r.x,y:r.y,w:r.w,h:r.h});
function footprint(q){return {x:q.x,y:q.y,w:q.a%180?q.d:q.w,h:q.a%180?q.w:q.d}}
function overlap(a,b){return a.x<b.x+b.w-1e-6&&a.x+a.w>b.x+1e-6&&a.y<b.y+b.h-1e-6&&a.y+a.h>b.y+1e-6}

function valid(m){for(const r of m.rooms){if(![r.x,r.y,r.w,r.h].every(Number.isFinite)||r.w<240||r.h<220||r.w>5000||r.h>5000)return 'Room dimensions must be finite and within the study range.';for(const s of r.shelves){let f=footprint(s);if(f.x<0||f.y<0||f.x+f.w>r.w||f.y+f.h>r.h)return 'Room reduction would cross a Shelf footprint.';}}
for(let i=0;i<m.rooms.length;i++)for(let j=i+1;j<m.rooms.length;j++)if(overlap(m.rooms[i],m.rooms[j]))return 'Rooms cannot overlap.';
for(const d of m.doors){const a=find(m,d.a),b=find(m,d.b),c=common(a,b);if(!c||c.axis!==d.axis)return 'Connected Rooms must retain a shared wall. Disconnect explicitly first.';if(!Number.isFinite(d.at)||!Number.isFinite(d.w)||d.w<60||d.w>240||d.at-d.w/2<c.lo+30||d.at+d.w/2>c.hi-30)return 'Doorway must fit the shared wall with corner clearance.';if([a,b].some(r=>r.shelves.some(s=>overlap(footprint(s),clearance(r,c,d)))))return 'Doorway clearance intersects a Shelf.';for(const e of m.doors){if(e.id===d.id)continue;const f=common(find(m,e.a),find(m,e.b));if(f&&f.axis===c.axis&&f.line===c.line&&Math.abs(e.at-d.at)<(e.w+d.w)/2+20)return 'Doorways on the same wall must not overlap.';}}return ''}
function status(t,error=false){$('status').textContent=t;$('status').classList.toggle('error',error)}
function theme(){themes[$('theme').value].forEach((c,i)=>document.documentElement.style.setProperty('--'+['bg','panel','metal','etch','text'][i],c))}
function palette(r){return themes[r.palette]||themes[$('theme').value]}
function css(r){return palette(r).map((c,i)=>'--'+['bg','panel','metal','etch','text'][i]+':'+c).join(';')}

function fitBounds(r=null){const rs=r?[r]:model().rooms;let x=Math.min(...rs.map(r=>r.x))-100,y=Math.min(...rs.map(r=>r.y))-100,w=Math.max(...rs.map(r=>r.x+r.w))+100-x,h=Math.max(...rs.map(r=>r.y+r.h))+100-y;let p=viewport(),a=p.w/p.h;if(w/h>a){let hh=w/a;y-=(hh-h)/2;h=hh}else{let ww=h*a;x-=(ww-w)/2;w=ww}return{x,y,w,h}}
function fit(){stopFlight();focusView=null;selected=null;view=fitBounds(inside?find(model(),inside):null);render()}
function point(e){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());return{x:p.x,y:p.y}}
function zoom(f,p=null){stopFlight();let v=view;p=p||{x:v.x+v.w/2,y:v.y+v.h/2};let w=clamp(v.w*f,280,20000),s=w/v.w;view={x:p.x-(p.x-v.x)*s,y:p.y-(p.y-v.y)*s,w,h:v.h*s};render()}
// Stable world-coordinate isocontours, sampled on an aligned lattice. No physical terrain.
const terrain=(x,y)=>Math.sin(x/680+y/1100)*1.05+Math.cos(y/420-x/930)*.76+Math.sin((x+y)/390)*.30+Math.cos((x-2*y)/2100)*.68;
let contourCache=null;

function shelfPlanSymbol(w,d,stroke){

 const rect=(x,y,ww,dd,fill,st='none',sw=1.5)=>`<rect x="${x}" y="${y}" width="${ww}" height="${dd}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`;

function roomOpenings(m,r){return m.doors.filter(d=>d.a===r.id||d.b===r.id).map(d=>({...d,...common(find(m,d.a),find(m,d.b))})).filter(d=>d.line!==undefined)}

// Exact allowed centre intervals for the existing sample clearance policy.

svg.addEventListener('pointermove',e=>{if(!gesture)return;const g=gesture;if(Math.hypot(e.clientX-g.client[0],e.clientY-g.client[1])<4&&!g.moved)return;g.moved=true;const p=point(e),dx=p.x-g.p.x,dy=p.y-g.p.y,round=v=>snap?Math.round(v/interval)*interval:v;const t=g.t;if(!t||inside||!draft){if(t&&!inside)return;const b=viewport();view={...g.view,x:g.view.x-(e.clientX-g.client[0])*g.view.w/b.w,y:g.view.y-(e.clientY-g.client[1])*g.view.h/b.h};render();return}if(t.kind==='suggest')return;let m=cp(g.base),result={lost:[],shifted:0};guide=null;if(t.kind==='door'){const d=door(m,t.id),delta=round(d.axis==='v'?dy:dx);let at=d.at,w=d.w;if(t.handle==='start'){w=clamp(d.w-delta,60,240);at=d.at+(d.w-w)/2}else if(t.handle==='end'){w=clamp(d.w+delta,60,240);at=d.at+(w-d.w)/2}else at+=delta;const q=nearestDoor(m,d,at,w);if(!q){status('No clear opening of that size. Try a smaller adjustment.',true);return}Object.assign(d,q)}else{let r=find(m,t.id);if(t.kind==='resize'){let h=t.handle;if(h.includes('e'))r.w+=round(dx);if(h.includes('s'))r.h+=round(dy);if(h.includes('w')){r.x+=round(dx);r.w-=round(dx)}if(h.includes('n')){r.y+=round(dy);r.h-=round(dy)}}else{r.x+=round(dx);r.y+=round(dy)}guide=magnetic(m,t.id,t.kind==='resize',t.handle);result=reconcile(m,t.id)}let err=valid(m);if(err){status(err,true);return}draft=m;g.lost=result.lost;g.shifted=result.shifted;render();status(result.lost.length?`${result.lost.length} doorway(s) would disconnect on this move.`:result.shifted?'Doorways adjusted to clear shared wall.':guide?'Walls aligned · click + to add a doorway.':'Valid provisional geometry.');});
svg.addEventListener('pointerup',e=>{let g=gesture;gesture=null;if(!g)return;if(g.moved&&g.lost.length){pendingChange(g.base,g.lost);return}if(!g.moved&&!draft&&!inside&&g.t?.kind==='room')enter(g.t.id);else if(!g.moved&&draft){if(g.t?.kind==='suggest')acceptSuggestion(g.t.id);else if(g.t)focusTarget({kind:g.t.kind==='resize'?'room':g.t.kind,id:g.t.id});else clearFocus()}else render()});
svg.addEventListener('pointercancel',()=>{if(gesture&&draft)draft=gesture.base;gesture=null;guide=null;render()});
svg.addEventListener('wheel',e=>{e.preventDefault();if(gesture)return;zoom(Math.exp(clamp(e.deltaY,-200,200)*.002),point(e))},{passive:false});
svg.addEventListener('pointerover',e=>{if(gesture||flight)return;let t=target(e);if(!t||t.kind==='suggest')return;const r=find(model(),t.id),d=door(model(),t.id);$('tip').textContent=r?`${r.name} · ${r.w} × ${r.h} · ${r.shelves.length} Shelves · ${r.family==='inherit'?'Inherited: '+families[model().appearance.family]:families[r.family]}`:d?`${find(model(),d.a).name} ↔ ${find(model(),d.b).name} · width ${d.w}`:'';$('tip').hidden=false;$('tip').style.left=clamp(e.clientX+12,6,innerWidth-280)+'px';$('tip').style.top=clamp(e.clientY+14,6,innerHeight-70)+'px'});svg.addEventListener('pointerout',()=>{$('tip').hidden=true});
svg.addEventListener('keydown',e=>{const t=target(e);if(!t||inside||pending)return;if(t.kind==='suggest'&&['Enter',' '].includes(e.key)){e.preventDefault();acceptSuggestion(t.id);return}if(e.key==='ContextMenu'||e.shiftKey&&e.key==='F10'){e.preventDefault();const r=e.target.getBoundingClientRect();if(t.kind==='door')doorMenu(t.id,r.x,r.y);else roomMenu(t.id,r.x,r.y)}else if(['Enter',' '].includes(e.key)){e.preventDefault();if(draft){focusTarget(t);svg.querySelector(`[data-${t.kind==='door'?'door':'room'}="${t.id}"]`)?.focus({preventScroll:true})}else if(t.kind==='room')enter(t.id)}});
$('mainMenu').onclick=e=>{if(pending||!closePane())return;let b=e.target.getBoundingClientRect();rootMenu(b.left,b.bottom+4,{x:view.x+view.w*.22,y:view.y+view.h*.72})};$('mode').onclick=()=>{if(!closePane())return;if(draft)commit();else begin()};$('close').onclick=()=>closePane();$('roomBack').onclick=back;$('theme').onchange=()=>{theme();render()};$('detail').onchange=render;$('plus').onclick=()=>zoom(.75);$('minus').onclick=()=>zoom(1/.75);$('fit').onclick=fit;$('focusBack').onclick=()=>{if(!pending&&closePane())clearFocus()};$('keepMove').onclick=()=>resolveChange(true);$('restoreMove').onclick=()=>resolveChange(false);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#mainMenu'))closeMenu();if(panel&&!e.target.closest('#pane,#map,#mode,#mainMenu,#close')&&!closePane())e.preventDefault()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(pending)resolveChange(false);else if(!$('menu').hidden)closeMenu();else if(panel)closePane(true);else if(inside)back();else if(draft){draft=null;selected=null;render();status('Arrangement discarded.')} }if(e.key==='Enter'&&panel&&e.target.matches('input')){e.preventDefault();closePane()}});
new ResizeObserver(()=>{if(gesture||flight)return;const p=viewport(),h=view.w*p.h/p.w;view.y+=(view.h-h)/2;view.h=h;render()}).observe(svg);
window.__mapStudy={state:()=>cp({saved,draft,selected,inside,view,grid,snap,interval,magnet,focusView,pending,flight:!!flight}),valid,common,openings:id=>cp(roomOpenings(model(),find(model(),id))),model:()=>cp(model()),wallPath,fit,zoom,doorRanges,proposals};theme();fit();
