'use strict';
const $=id=>document.getElementById(id),svg=$('map'),cp=v=>JSON.parse(JSON.stringify(v)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);

const shelf=(id,x,y,w,d,a=0)=>({id,x,y,w,d,a});
const room=(id,name,subtitle,x,y,w,h,shelves)=>({id,name,subtitle,x,y,w,h,shelves,palette:'inherit',family:'inherit'});
const initial={next:5,rooms:[room('hall','The Main Hall','General collection',0,0,1200,820,[shelf(1,58,72,260,92),shelf(2,377,72,240,92),shelf(3,1050,110,245,92,90)]),room('manuscripts','Manuscripts','Research & studies',1200,0,790,460,[shelf(4,64,65,220,75),shelf(5,470,65,245,75)]),room('records','Records','',1200,460,790,360,[shelf(6,100,240,250,70)]),room('collections','Collections','Illustrations & charts',250,1060,820,420,[shelf(7,80,70,250,80),shelf(8,400,70,250,80)])],doors:[{id:'door-1',a:'hall',b:'manuscripts',axis:'v',at:390,w:60},{id:'door-2',a:'hall',b:'records',axis:'v',at:650,w:100}],appearance:{contours:'subtle',density:55,family:'astral'},nextDoor:3};
let saved=cp(initial),draft=null,history=[],selected=null,inside=null,returnView=null,gesture=null,panel=null,preview=null,menuAnchor=null,grid=true,snap=true,interval=20,view={x:-100,y:-100,w:2200,h:1650};
const model=()=>preview||draft||saved,find=(m,id)=>m.rooms.find(r=>r.id===id),door=(m,id)=>m.doors.find(d=>d.id===id),dims=r=>({x:r.x,y:r.y,w:r.w,h:r.h});
function footprint(q){return {x:q.x,y:q.y,w:q.a%180?q.d:q.w,h:q.a%180?q.w:q.d}}
function overlap(a,b){return a.x<b.x+b.w-1e-6&&a.x+a.w>b.x+1e-6&&a.y<b.y+b.h-1e-6&&a.y+a.h>b.y+1e-6}
function common(a,b){if(!a||!b)return null;let axis,line,lo,hi;if(a.x+a.w===b.x||b.x+b.w===a.x){axis='v';line=a.x+a.w===b.x?b.x:a.x;lo=Math.max(a.y,b.y);hi=Math.min(a.y+a.h,b.y+b.h)}else if(a.y+a.h===b.y||b.y+b.h===a.y){axis='h';line=a.y+a.h===b.y?b.y:a.y;lo=Math.max(a.x,b.x);hi=Math.min(a.x+a.w,b.x+b.w)}else return null;return hi>lo?{axis,line,lo,hi}:null}
function clearance(r,c,d){const p=d.at-d.w/2;return c.axis==='v'?{x:c.line===r.x?0:r.w-70,y:p-r.y,w:70,h:d.w}:{x:p-r.x,y:c.line===r.y?0:r.h-70,w:d.w,h:70}}
function valid(m){for(const r of m.rooms){if(![r.x,r.y,r.w,r.h].every(Number.isFinite)||r.w<240||r.h<220||r.w>5000||r.h>5000)return 'Room dimensions must be finite and within the study range.';for(const s of r.shelves){let f=footprint(s);if(f.x<0||f.y<0||f.x+f.w>r.w||f.y+f.h>r.h)return 'Room reduction would cross a Shelf footprint.';}}
for(let i=0;i<m.rooms.length;i++)for(let j=i+1;j<m.rooms.length;j++)if(overlap(m.rooms[i],m.rooms[j]))return 'Rooms cannot overlap.';
for(const d of m.doors){const a=find(m,d.a),b=find(m,d.b),c=common(a,b);if(!c||c.axis!==d.axis)return 'Connected Rooms must retain a shared wall. Disconnect explicitly first.';if(!Number.isFinite(d.at)||!Number.isFinite(d.w)||d.w<60||d.w>240||d.at-d.w/2<c.lo+30||d.at+d.w/2>c.hi-30)return 'Doorway must fit the shared wall with corner clearance.';if([a,b].some(r=>r.shelves.some(s=>overlap(footprint(s),clearance(r,c,d)))))return 'Doorway clearance intersects a Shelf.';for(const e of m.doors){if(e.id===d.id)continue;const f=common(find(m,e.a),find(m,e.b));if(f&&f.axis===c.axis&&f.line===c.line&&Math.abs(e.at-d.at)<(e.w+d.w)/2+20)return 'Doorways on the same wall must not overlap.';}}return ''}
function status(t,error=false){$('status').textContent=t;$('status').classList.toggle('error',error)}
function theme(){themes[$('theme').value].forEach((c,i)=>document.documentElement.style.setProperty('--'+['bg','panel','metal','etch','text'][i],c))}
function palette(r){return themes[r.palette]||themes[$('theme').value]}
function css(r){return palette(r).map((c,i)=>'--'+['bg','panel','metal','etch','text'][i]+':'+c).join(';')}
function viewport(){const b=svg.getBoundingClientRect();return {w:b.width||1,h:b.height||1}}
function fitBounds(r=null){const rs=r?[r]:model().rooms;let x=Math.min(...rs.map(r=>r.x))-100,y=Math.min(...rs.map(r=>r.y))-100,w=Math.max(...rs.map(r=>r.x+r.w))+100-x,h=Math.max(...rs.map(r=>r.y+r.h))+100-y;let p=viewport(),a=p.w/p.h;if(w/h>a){let hh=w/a;y-=(hh-h)/2;h=hh}else{let ww=h*a;x-=(ww-w)/2;w=ww}return{x,y,w,h}}
function fit(){view=fitBounds(inside?find(model(),inside):null);render()}
function point(e){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());return{x:p.x,y:p.y}}
function zoom(f,p=null){let v=view;p=p||{x:v.x+v.w/2,y:v.y+v.h/2};let w=clamp(v.w*f,280,20000),s=w/v.w;view={x:p.x-(p.x-v.x)*s,y:p.y-(p.y-v.y)*s,w,h:v.h*s};render()}
// Stable world-coordinate isocontours, sampled on an aligned lattice. No physical terrain.
const terrain=(x,y)=>Math.sin(x/680+y/1100)*1.05+Math.cos(y/420-x/930)*.76+Math.sin((x+y)/390)*.30+Math.cos((x-2*y)/2100)*.68;
let contourCache=null;
function contours(m){if(inside||m.appearance.contours==='none')return '';const step=Math.max(45,Math.ceil(view.w/140/45)*45),pad=step*2,x0=Math.floor((view.x-pad)/step)*step,y0=Math.floor((view.y-pad)/step)*step,nx=Math.ceil((view.w+pad*2)/step),ny=Math.ceil((view.h+pad*2)/step),delta=.40-(m.appearance.density/100)*.25,key=[x0,y0,nx,ny,step,delta].join(',');let paths;if(contourCache?.key===key)paths=contourCache.paths;else{paths=[];const vals=Array.from({length:ny+1},(_,j)=>Array.from({length:nx+1},(_,i)=>terrain(x0+i*step,y0+j*step)));for(let l=-3;l<=3;l+=delta){let d='';for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){let v=[vals[j][i],vals[j][i+1],vals[j+1][i+1],vals[j+1][i]],p=[[0,0],[1,0],[1,1],[0,1]],hits=[];for(let k=0;k<4;k++){let a=v[k],b=v[(k+1)%4];if((a<l)===(b<l))continue;let t=(l-a)/(b-a),q=p[k],r=p[(k+1)%4];hits.push([Math.round(x0+(i+q[0]+(r[0]-q[0])*t)*step),Math.round(y0+(j+q[1]+(r[1]-q[1])*t)*step)])}for(let k=0;k+1<hits.length;k+=2)d+=`M${hits[k].join(' ')}L${hits[k+1].join(' ')}`;}if(d)paths.push(d)}contourCache={key,paths}}return `<g fill="none" stroke="var(--etch)" opacity="${m.appearance.contours==='engraved'?.28:.13}" pointer-events="none">${paths.map((d,i)=>`<path d="${d}" stroke-width="${i%5===0?1.15:.65}" vector-effect="non-scaling-stroke" stroke-linecap="round"/>`).join('')}</g>`}
function shelfPlanSymbol(w,d,stroke){
 const hw=w/2,hd=d/2,frame='var(--panel)',recess='var(--bg)',bright='var(--etch)';
 const rect=(x,y,ww,dd,fill,st='none',sw=1.5)=>`<rect x="${x}" y="${y}" width="${ww}" height="${dd}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`;
 const path=(p,st=stroke,sw=1.5,fill='none')=>`<path d="${p}" fill="${fill}" stroke="${st}" stroke-width="${sw}"/>`;
 const lip=Math.min(7,d*.16),inset=Math.min(7,d*.14,w*.08);
 return rect(-hw,-hd,w,d,frame,stroke,1.8)+rect(-hw+inset,-hd+inset,w-2*inset,d-2*inset,recess,'var(--metal)',1.4)+rect(-hw+inset*2,-hd+inset*2,w-4*inset,d-4*inset,'var(--panel)',stroke,1.1)+path(`M${-hw+inset} ${hd-lip}H${hw-inset}`,bright,2.5);
}
function ornament(f){return ({astral:'M0 -25L5 -5L23 0L5 5L0 25L-5 5L-23 0L-5 -5Z',botanical:'M0 22V-22M0 9Q-25 7 -20 -12Q-3 -12 0 9ZM0 0Q23 -2 18 -20Q2 -18 0 0Z',plain:'M0 -22L22 0L0 22L-22 0ZM0 -11L11 0L0 11L-11 0Z',bestiary:'M-13 -19Q0 -25 15 -18Q13 7 -16 23Q-6 2 -13 -19ZM-6 -15Q4 -3 -9 12',water:'M-22 10Q-8 -6 5 3Q16 11 22 -7M-18 20Q-4 8 8 17Q16 22 20 16',air:'M-22 -2Q-8 -14 7 -6Q17 -1 22 -12M-18 10Q-2 0 10 8Q16 12 20 7M-9 18Q0 12 9 16',earth:'M-18 15L-7 -12L2 1L12 -18L20 15M-10 4L-2 -7L6 4L14 -6',fire:'M0 -20Q9 -8 6 2Q16 0 18 12Q19 23 8 29Q1 24 0 14Q-1 24 -8 29Q-19 23 -18 12Q-16 0 -6 2Q-9 -8 0 -20Z',horological:'M0 -18A18 18 0 1 1 0 18A18 18 0 1 1 0 -18M0 -18V-24M18 0H24M0 18V24M-18 0H-24M0 0V-9M0 0L8 4'})[f]||''}
function mark(f,x,y,r,opacity=.6){const p=ornament(f);return p?`<g data-family-mark="${f}" transform="translate(${x} ${y}) scale(${r/25})" fill="none" stroke="var(--etch)" stroke-width="2" opacity="${opacity}" pointer-events="none"><path d="${p}" stroke-linejoin="round" stroke-linecap="round"/></g>`:''}
function roomOpenings(m,r){return m.doors.filter(d=>d.a===r.id||d.b===r.id).map(d=>({...d,...common(find(m,d.a),find(m,d.b))})).filter(d=>d.line!==undefined)}
function wallPath(m,r,inset=0){let o='';for(const [axis,line,lo,hi,draw] of [['h',r.y,r.x,r.x+r.w,r.y+inset],['h',r.y+r.h,r.x,r.x+r.w,r.y+r.h-inset],['v',r.x,r.y,r.y+r.h,r.x+inset],['v',r.x+r.w,r.y,r.y+r.h,r.x+r.w-inset]]){let p=lo+inset;const seg=(a,b)=>b>a?(axis==='h'?`M${a} ${draw}H${b}`:`M${draw} ${a}V${b}`):'';for(const d of roomOpenings(m,r).filter(d=>d.axis===axis&&d.line===line).sort((a,b)=>a.at-b.at)){o+=seg(p,Math.min(hi-inset,d.at-d.w/2));p=Math.max(p,d.at+d.w/2)}o+=seg(p,hi-inset)}return o}
function plan(m,r){let o=`<g data-room-plan="${r.id}" pointer-events="none"><path d="${wallPath(m,r,12)}" fill="none" stroke="var(--metal)" stroke-width="1.5" opacity=".48" stroke-dasharray="2 4"/>`;for(const q of r.shelves){const f=footprint(q);o+=`<g data-plan-symbol="H" transform="translate(${r.x+f.x+f.w/2} ${r.y+f.y+f.h/2}) rotate(${q.a})" style="${css({palette:'inherit'})}">${shelfPlanSymbol(q.w,q.d,'var(--etch)')}</g>`}return o+'</g>'}
function doorArt(m,d,scale){const c=common(find(m,d.a),find(m,d.b));if(!c)return '';let a=d.at-d.w/2,b=d.at+d.w/2,L=c.line,t=12/scale,sel=selected?.id===d.id,stroke=sel?'var(--text)':'var(--etch)',p=c.axis==='v'?`M${L-t} ${a}H${L+t}M${L-t} ${b}H${L+t}M${L} ${a}V${b}`:`M${a} ${L-t}V${L+t}M${b} ${L-t}V${L+t}M${a} ${L}H${b}`,hit=c.axis==='v'?`x="${L-t}" y="${a}" width="${2*t}" height="${d.w}"`:`x="${a}" y="${L-t}" width="${d.w}" height="${2*t}"`;return `<g data-door="${d.id}" role="button" tabindex="0" aria-label="Doorway ${esc(find(m,d.a).name)} to ${esc(find(m,d.b).name)}"><rect ${hit} fill="transparent"/><path d="${p}" fill="none" stroke="${stroke}" stroke-width="${sel?2:1.25}" vector-effect="non-scaling-stroke" stroke-dasharray="${sel?'none':'3 2'}" pointer-events="none"/></g>`}
function render(){const m=model(),p=viewport(),scale=p.w/view.w;svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);svg.classList.toggle('arrange',!!draft&&!inside);document.body.classList.toggle('inside',!!inside);$('title').textContent=inside?find(m,inside)?.name:'The Map Room';$('mode').textContent=draft?'Arrange':'Browse';$('mode').setAttribute('aria-pressed',String(!!draft));$('zoomLabel').textContent=Math.round(scale/(p.w/fitBounds().w)*100)+'%';const show=$('detail').value,detail=inside||show==='plan'||(show==='auto'&&view.w<fitBounds().w*.77&&scale>.26);$('level').textContent=inside?'ROOM PLAN REFERENCE':detail?'SIMPLIFIED PLAN':'ORGANIZATIONAL VIEW';let o=contours(m);if(draft&&grid&&!inside)o+=`<defs><pattern id="grid" width="${interval}" height="${interval}" patternUnits="userSpaceOnUse"><path d="M${interval} 0H0V${interval}" fill="none" stroke="var(--etch)" stroke-opacity=".11" stroke-width=".7"/></pattern></defs><rect x="${view.x}" y="${view.y}" width="${view.w}" height="${view.h}" fill="url(#grid)" pointer-events="none"/>`;
for(const r of m.rooms.filter(r=>!inside||r.id===inside)){const sel=selected?.id===r.id,rich=!!detail;let fs=clamp(22/scale,21,Math.min(58,r.w/Math.max(7,r.name.length)*1.65)),cy=r.y+r.h/2;let fill=rich?'var(--bg)':'var(--panel)';o+=`<g data-room="${r.id}" role="button" tabindex="0" aria-label="${esc(r.name)}" style="${css(r)}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${fill}"/><path d="${wallPath(m,r)}" stroke="var(--metal)" stroke-width="${sel?3:2.2}" vector-effect="non-scaling-stroke" fill="none"/>`;if(rich)o+=plan(m,r)+mark(r.family==='inherit'?m.appearance.family:r.family,r.x+32,r.y+32,13,.42);else o+=`<path d="${wallPath(m,r,12)}" stroke="var(--etch)" stroke-width="1.1" fill="none" opacity=".34" pointer-events="none"/>`;
if(!inside){const sub=r.subtitle&&r.h*scale>68,ty=cy-(sub?fs*.28:0),max=Math.max(6,Math.floor(r.w/(fs*.56))),name=r.name.length>max?r.name.slice(0,max-1)+'…':r.name;const submax=Math.max(8,Math.floor(r.w/(fs*.34)));o+=`<text class="map-label" x="${r.x+r.w/2}" y="${ty}" font-size="${fs}" dominant-baseline="middle">${esc(name)}</text>${sub?`<text class="subtitle" x="${r.x+r.w/2}" y="${ty+fs*.92}" style="font-size:${fs*.47}px">${esc(r.subtitle.length>submax?r.subtitle.slice(0,submax-1)+'…':r.subtitle)}</text>`:''}`}
if(draft&&!inside&&sel)o+=`<rect data-resize="${r.id}" x="${r.x+r.w-7/scale}" y="${r.y+r.h-7/scale}" width="${14/scale}" height="${14/scale}" fill="var(--bg)" stroke="var(--etch)" stroke-width="1.5" vector-effect="non-scaling-stroke" aria-label="Resize ${esc(r.name)}"/>`;o+='</g>'}
for(const d of m.doors.filter(d=>!inside||d.a===inside||d.b===inside))o+=doorArt(m,d,scale);if(!inside)o+=mark(m.appearance.family,view.x+31/scale,view.y+31/scale,14/scale,.65);svg.innerHTML=o;}
function begin(){if(!draft){draft=cp(saved);selected=null;render();status('Arrange · valid changes save when returning to Browse.')}}
function commit(){if(!draft)return true;const e=valid(draft);if(e){status(e,true);return false}if(JSON.stringify(draft)!==JSON.stringify(saved)){history.push(cp(saved));saved=cp(draft)}draft=null;selected=null;render();status('Browse · valid arrangement saved.');return true}
function edit(fn){const was=!!draft,m=cp(model());fn(m);const err=valid(m);if(err){status(err,true);return false}if(was)draft=m;else if(JSON.stringify(m)!==JSON.stringify(saved)){history.push(cp(saved));saved=m}render();return true}
function closeMenu(){ $('menu').hidden=true;$('mainMenu').setAttribute('aria-expanded','false') }
function closePane(cancel=false){if(!panel)return true;const p=preview;preview=null;if(!cancel&&panel.save&&!panel.save()){preview=p;render();return false}panel.controller?.abort();panel=null;$('pane').hidden=true;if(p)render();return true}
function openPane(title,build,save){if(!closePane())return;closeMenu();$('tip').hidden=true;panel?.controller?.abort();panel={save,controller:new AbortController()};$('paneTitle').textContent=title;$('fields').replaceChildren();build();$('pane').hidden=false;$('fields').querySelector('input,select,button')?.focus({preventScroll:true})}
function field(label,id,val,opts=null,type='text'){const l=document.createElement('label');l.textContent=label;const el=document.createElement(opts?'select':'input');el.id=id;if(opts){for(const [v,n] of opts)el.add(new Option(n,v))}else el.type=type;el.value=val;if(type==='checkbox')el.checked=val;l.append(el);$('fields').append(l);return el}
function note(s){const p=document.createElement('p');p.textContent=s;$('fields').append(p)}
function action(s,fn){const b=document.createElement('button');b.textContent=s;b.onclick=fn;$('fields').append(b);return b}
function opts(obj){return Object.entries(obj)}
function num(id){const e=$(id);return e.value.trim()===''?NaN:Number(e.value)}
function liveAppearance(fn){const change=()=>{let m=cp(draft||saved);if(fn(m)!==false){preview=m;render()}};$('fields').addEventListener('input',change,{signal:panel.controller.signal});}
function roomEditor(id,geometry=false){const r=find(model(),id);if(!r)return; if(geometry)begin();openPane(geometry?'Room dimensions':'Room appearance',()=>{if(geometry){for(const [k,l] of [['x','X'],['y','Y'],['w','Width'],['h','Depth']])field(l,'r-'+k,r[k],null,'number');note('Numeric values are exact. Moving or resizing must preserve attached doorways and existing Shelf footprints.')}else{field('Title','r-name',r.name);field('Subtitle','r-sub',r.subtitle);field('Palette','r-pal',r.palette,[['inherit','Follow desktop'],...Object.keys(themes).map(k=>[k,k])]);field('Family','r-family',r.family,opts(families));note('Room family is inherited unless overridden. Detailed interior materials remain in the Room appearance interface.');liveAppearance(m=>{const a=find(m,id);a.name=$('r-name').value.trim()||r.name;a.subtitle=$('r-sub').value.trim();a.palette=$('r-pal').value;a.family=$('r-family').value})}} ,()=>{const ok=edit(m=>{const a=find(m,id);if(geometry)for(const k of ['x','y','w','h'])a[k]=num('r-'+k);else{a.name=$('r-name').value.trim()||r.name;a.subtitle=$('r-sub').value.trim();a.palette=$('r-pal').value;a.family=$('r-family').value}});if(ok)status('Room settings saved.');return ok})}
function mapAppearance(){const a=model().appearance;openPane('Map appearance',()=>{field('Contours','contours',a.contours,[['none','None'],['subtle','Subtle'],['engraved','Engraved']]);field('Density','density',a.density,null,'number');$('density').min=0;$('density').max=100;field('Family','map-family',a.family,opts(families).filter(([k])=>k!=='inherit'));note('Contours are decorative. Family provides the inherited Room default.');liveAppearance(m=>{const d=num('density');if(!Number.isFinite(d)||d<0||d>100)return false;m.appearance={contours:$('contours').value,density:d,family:$('map-family').value}});},()=>{const d=num('density');if(!Number.isFinite(d)||d<0||d>100){status('Density must be 0–100.',true);return false}return edit(m=>{m.appearance={contours:$('contours').value,density:d,family:$('map-family').value}})})}
function gridEditor(){openPane('Grid and snapping',()=>{field('Show grid','g-visible',grid,null,'checkbox');field('Snap increments','g-snap',snap,null,'checkbox');field('Interval','g-step',interval,null,'number');note('Grid and snapping are independent. Numeric dimensions ignore snapping.');},()=>{let n=num('g-step');if(!Number.isFinite(n)||n<5||n>200){status('Interval must be 5–200.',true);return false}grid=$('g-visible').checked;snap=$('g-snap').checked;interval=n;render();return true})}
function addRoom(p){begin();openPane('New Room',()=>{field('Title','new-name','New Room');field('Subtitle','new-sub','');field('X','new-x',Math.round(p.x/interval)*interval,null,'number');field('Y','new-y',Math.round(p.y/interval)*interval,null,'number');field('Width','new-w',600,null,'number');field('Depth','new-h',440,null,'number');note('Place a rectangular Room in clear map space. Escape cancels creation.');},()=>{const ok=edit(m=>{m.rooms.push(room('room-'+m.next++,$('new-name').value.trim()||'New Room',$('new-sub').value.trim(),num('new-x'),num('new-y'),num('new-w'),num('new-h'),[]))});if(ok)status('Room added to arrangement.');return ok})}
function doorEditor(id){begin();const d=door(model(),id);if(!d)return;const a=find(model(),d.a),b=find(model(),d.b),c=common(a,b);openPane('Shared doorway',()=>{note(a.name+' ↔ '+b.name);field('Position along wall','d-at',d.at,null,'number');field('Width','d-w',d.w,null,'number');note(`Shared wall: ${c.lo}–${c.hi}. Both Room openings use this same doorway. Position uses map coordinates.`)},()=>{const ok=edit(m=>{let d=door(m,id);d.at=num('d-at');d.w=num('d-w')});if(ok)status('Both Room openings updated.');return ok})}
function addDoor(id){begin();const r=find(model(),id),neighbors=model().rooms.filter(b=>b.id!==id&&common(r,b));if(!neighbors.length){status('Move a Room against another Room before connecting.',true);return}openPane('Connect Rooms',()=>{field('Adjacent Room','d-neighbor',neighbors[0].id,neighbors.map(b=>[b.id,b.name]));field('Position along wall','d-at',0,null,'number');field('Width','d-w',100,null,'number');const reset=()=>{const c=common(r,find(model(),$('d-neighbor').value));let chosen=(c.lo+c.hi)/2;for(let x=c.lo+80;x<=c.hi-80;x+=20){let test=cp(model());test.doors.push({id:'trial',a:id,b:$('d-neighbor').value,axis:c.axis,at:x,w:100});if(!valid(test)){chosen=x;break}}$('d-at').value=chosen};$('d-neighbor').onchange=reset;reset();note('A connection is a single shared opening. More than one doorway may fit a shared wall.');},()=>{const ok=edit(m=>{const b=$('d-neighbor').value,c=common(find(m,id),find(m,b));m.doors.push({id:'door-'+m.nextDoor++,a:id,b,axis:c.axis,at:num('d-at'),w:num('d-w')})});if(ok)status('Shared doorway added.');return ok})}
function disconnect(id){begin();const d=door(model(),id);if(!d)return;openPane('Disconnect doorway',()=>{note('Remove this connection from both Rooms? This does not remove either Room or its contents.');action('Disconnect',()=>{edit(m=>{m.doors=m.doors.filter(d=>d.id!==id)});closePane(true);selected=null;render();status('Doorway disconnected explicitly.');});action('Keep connection',()=>closePane(true));},null)}
function removeRoom(id){begin();const r=find(model(),id);if(model().rooms.length===1||r.shelves.length||model().doors.some(d=>d.a===id||d.b===id)){status('Only empty, disconnected Rooms can be removed in this study. Resolve contents/connections first.',true);return}openPane('Remove empty Room',()=>{note('Remove '+r.name+' from the map?');action('Remove Room',()=>{edit(m=>{m.rooms=m.rooms.filter(r=>r.id!==id)});closePane(true);selected=null;render()})},null)}
function menu(items,title,x,y){closeMenu();const el=$('menu');el.replaceChildren();let h=document.createElement('div');h.id='menuTitle';h.textContent=title;el.append(h);for(const [s,fn,disabled] of items){let b=document.createElement('button');b.setAttribute('role','menuitem');b.textContent=s;b.disabled=!!disabled;b.onclick=()=>{closeMenu();fn()};el.append(b)}el.hidden=false;$('mainMenu').setAttribute('aria-expanded','true');let b=el.getBoundingClientRect();el.style.left=clamp(x,4,Math.max(4,innerWidth-b.width-4))+'px';el.style.top=clamp(y,4,Math.max(4,innerHeight-b.height-4))+'px';el.querySelector('button:not(:disabled)')?.focus({preventScroll:true})}
function rootMenu(x,y,p){menu([['Appearance…',mapAppearance],['Add Room…',()=>addRoom(p)],['Grid and snapping…',gridEditor],['Fit map',fit],['Undo',undo,!history.length&&!draft]],'Map Room',x,y)}
function roomMenu(id,x,y){const items=[['Appearance…',()=>roomEditor(id)],['Dimensions…',()=>roomEditor(id,true)],['Connect doorway…',()=>addDoor(id)],['Remove empty Room…',()=>removeRoom(id)],['Enter Room',()=>{if(commit())enter(id)}]];menu(draft?[items[1],items[2],items[3],items[0]]:items,find(model(),id).name,x,y)}
function doorMenu(id,x,y){menu([['Position and width…',()=>doorEditor(id)],['Disconnect…',()=>disconnect(id)]],'Shared doorway',x,y)}
function undo(){if(!closePane())return;if(draft){draft=cp(saved);selected=null;render();status('Uncommitted arrangement restored.');return}if(history.length){saved=history.pop();selected=null;render();status('Previous map state restored.')}}
function enter(id){if(draft||inside||!closePane())return;returnView=cp(view);inside=id;selected=null;fit();status('Individual Room reference · shared wall openings use the same connection data.');}
function back(){if(!inside)return;inside=null;view=returnView;returnView=null;render();status('Returned to the original map view.')}
function target(e){let r=e.target.closest('[data-room]'),d=e.target.closest('[data-door]'),z=e.target.closest('[data-resize]');return d?{kind:'door',id:d.dataset.door}:z?{kind:'resize',id:z.dataset.resize}:r?{kind:'room',id:r.dataset.room}:null}
svg.addEventListener('contextmenu',e=>{e.preventDefault();if(inside||!closePane())return;let t=target(e);if(t?.kind==='door')doorMenu(t.id,e.clientX,e.clientY);else if(t)roomMenu(t.id,e.clientX,e.clientY);else rootMenu(e.clientX,e.clientY,point(e))});
svg.addEventListener('pointerdown',e=>{if(e.button!==0||!closePane())return;closeMenu();$('tip').hidden=true;const t=target(e),p=point(e);gesture={t,p,view:cp(view),client:[e.clientX,e.clientY],base:cp(model()),moved:false};if(draft&&t&&!inside){selected={kind:t.kind==='resize'?'room':t.kind,id:t.id};render()}svg.setPointerCapture(e.pointerId)});
svg.addEventListener('pointermove',e=>{if(!gesture)return;const g=gesture;if(Math.hypot(e.clientX-g.client[0],e.clientY-g.client[1])<4&&!g.moved)return;g.moved=true;const p=point(e),dx=p.x-g.p.x,dy=p.y-g.p.y,round=v=>snap?Math.round(v/interval)*interval:v;const t=g.t;if(!t||inside||!draft){if(t&&!inside)return;const b=viewport();view={...g.view,x:g.view.x-(e.clientX-g.client[0])*g.view.w/b.w,y:g.view.y-(e.clientY-g.client[1])*g.view.h/b.h};render();return}let m=cp(g.base);if(t.kind==='door'){const d=door(m,t.id);d.at+=round(d.axis==='v'?dy:dx)}else{let r=find(m,t.id);if(t.kind==='resize'){r.w+=round(dx);r.h+=round(dy)}else{r.x+=round(dx);r.y+=round(dy)}}let err=valid(m);if(err){status(err,true);return}draft=m;render();status('Valid provisional geometry.');});
svg.addEventListener('pointerup',e=>{let g=gesture;gesture=null;if(!g)return;if(!g.moved&&!draft&&!inside&&g.t?.kind==='room')enter(g.t.id);else if(!g.moved&&draft&&!g.t){selected=null;render()}});svg.addEventListener('pointercancel',()=>{if(gesture&&draft)draft=gesture.base;gesture=null;render()});
svg.addEventListener('wheel',e=>{e.preventDefault();if(gesture)return;zoom(Math.exp(clamp(e.deltaY,-200,200)*.002),point(e))},{passive:false});
svg.addEventListener('pointerover',e=>{if(gesture)return;let t=target(e);if(!t)return;const r=find(model(),t.id),d=door(model(),t.id);$('tip').textContent=r?`${r.name} · ${r.w} × ${r.h} · ${r.shelves.length} Shelves · ${r.family==='inherit'?'Inherited: '+families[model().appearance.family]:families[r.family]}`:d?`${find(model(),d.a).name} ↔ ${find(model(),d.b).name} · width ${d.w}`:'';$('tip').hidden=false;$('tip').style.left=clamp(e.clientX+12,6,innerWidth-280)+'px';$('tip').style.top=clamp(e.clientY+14,6,innerHeight-70)+'px'});svg.addEventListener('pointerout',()=>{$('tip').hidden=true});
svg.addEventListener('keydown',e=>{const t=target(e);if(!t||inside)return;if(e.key==='ContextMenu'||e.shiftKey&&e.key==='F10'){e.preventDefault();const r=e.target.getBoundingClientRect();if(t.kind==='door')doorMenu(t.id,r.x,r.y);else roomMenu(t.id,r.x,r.y)}else if(['Enter',' '].includes(e.key)){e.preventDefault();if(draft){selected=t;render();svg.querySelector(`[data-${t.kind==='door'?'door':'room'}="${t.id}"]`)?.focus({preventScroll:true})}else if(t.kind==='room')enter(t.id)}});
$('mainMenu').onclick=e=>{if(!closePane())return;let b=e.target.getBoundingClientRect();rootMenu(b.left,b.bottom+4,{x:view.x+view.w*.22,y:view.y+view.h*.72})};$('mode').onclick=()=>{if(!closePane())return;if(draft)commit();else begin()};$('close').onclick=()=>closePane();$('roomBack').onclick=back;$('theme').onchange=()=>{theme();render()};$('detail').onchange=render;$('plus').onclick=()=>zoom(.75);$('minus').onclick=()=>zoom(1/.75);$('fit').onclick=fit;
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#menu,#mainMenu'))closeMenu();if(panel&&!e.target.closest('#pane,#map,#mode,#mainMenu,#close')&&!closePane())e.preventDefault()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('menu').hidden)closeMenu();else if(panel)closePane(true);else if(inside)back();else if(draft){draft=null;selected=null;render();status('Arrangement discarded.')} }if(e.key==='Enter'&&panel&&e.target.matches('input')){e.preventDefault();closePane()}});
new ResizeObserver(()=>{if(gesture)return;const p=viewport(),h=view.w*p.h/p.w;view.y+=(view.h-h)/2;view.h=h;render()}).observe(svg);
window.__mapStudy={state:()=>cp({saved,draft,selected,inside,view,grid,snap,interval}),valid,common,openings:id=>cp(roomOpenings(model(),find(model(),id))),model:()=>cp(model()),wallPath,fit,zoom};theme();fit();
</script></body></html>
