<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Astral Archive · Room plan B8s12</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121e23;color:#e6e1d8;font:14px system-ui,sans-serif;--bg:#121e23;--panel:#263c37;--metal:#8c6e5a;--etch:#91ada1;--text:#e6e1d8;--error:#d08c83}button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--metal);border-radius:5px;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.38;cursor:default}button:hover:not(:disabled),button:focus-visible{border-color:var(--etch);outline:1px solid var(--etch)}header,footer{display:flex;align-items:center;gap:8px;padding:12px 18px;flex-wrap:wrap}header{border-bottom:1px solid color-mix(in srgb,var(--metal) 40%,transparent)}header .name{font:17px Georgia,serif;letter-spacing:.13em;text-transform:uppercase;flex:1}header .sub{font-size:11px;color:var(--etch);letter-spacing:.05em}main{position:relative;display:flex;flex-direction:column;min-height:0;flex:1}body{height:100dvh;display:flex;flex-direction:column}#scene{width:100%;flex:1;min-height:200px;touch-action:none;display:block;user-select:none}footer{border-top:1px solid color-mix(in srgb,var(--metal) 40%,transparent);justify-content:center;min-height:60px}#status{flex:1;color:var(--etch);font-size:12px;min-width:150px}#status.error{color:var(--error)}.controls{position:absolute;top:10px;right:12px;max-width:min(365px,calc(100% - 24px));max-height:calc(100% - 20px);overflow:auto;background:var(--bg);border:1px solid var(--metal);border-radius:7px;box-shadow:0 8px 24px #0004;padding:12px;z-index:2}.controls.left{right:auto;left:12px}.controls h2{font:16px Georgia,serif;margin:0}.controls .line{display:flex;align-items:center;gap:6px;margin:8px 0;flex-wrap:wrap}.controls label{font-size:12px;display:flex;align-items:center;gap:5px}.controls input[type=number]{width:80px;padding:5px}.controls input[type=checkbox]{accent-color:var(--etch)}.controls fieldset{border:1px solid var(--metal);border-radius:5px;margin:10px 0;padding:9px}.controls legend{color:var(--etch);font-size:12px}.controls .note{color:var(--etch);font-size:11px;line-height:1.4}.spacer{flex:1}.hide,[hidden]{display:none!important}svg text{font-family:system-ui,sans-serif;fill:var(--text);pointer-events:none}svg .draftLabel{fill:var(--etch);font-size:11px;letter-spacing:.1em}svg .dim{fill:var(--etch);font-size:12px;font-variant-numeric:tabular-nums}svg .shelfLabel{font:14px Georgia,serif;letter-spacing:.025em}svg .shelfNo{fill:var(--etch);font-size:10px;letter-spacing:.1em}svg .move{cursor:move}svg .resize{cursor:nwse-resize}svg .turn{cursor:grab}svg .roomsize{cursor:nwse-resize}@media(max-width:600px){header,footer{padding:8px;gap:5px}header .name{font-size:14px;min-width:100%}header .sub{display:none}.controls{max-width:min(300px,calc(100% - 16px));right:8px}button{padding:6px 8px}}
</style></head><body>
<header><div class="name">The Main Hall <span class="sub"> · Room plan</span></div><label> <select id="theme" aria-label="Palette"><option>Twilight</option><option>Evening</option><option>Midnight</option></select></label><button id="mode" aria-pressed="false">Arrange</button><button id="geometry" hidden>Geometry</button></header>
<main><svg id="scene" xmlns="http://www.w3.org/2000/svg" aria-label="Top-down Room floorplan"></svg>
<section id="panel" class="controls" hidden aria-label="Geometry controls"><div class="line"><h2>Plan geometry</h2><span class="spacer"></span><button id="side" aria-label="Move inspector to opposite side">⇄</button><button id="close" aria-label="Close inspector">×</button></div><div class="line"><label><input type="checkbox" id="grid" checked> Grid</label><label><input type="checkbox" id="snap" checked> Snap</label><label>Interval <input id="interval" type="number" min="1" max="100" step="1" value="20"></label></div><fieldset><legend>Room · width × depth</legend><div class="line"><label>W <input type="number" id="roomW" min="320" max="1800" step="any"></label><label>D <input type="number" id="roomD" min="240" max="1300" step="any"></label></div><button id="roomSet">Set exact dimensions</button></fieldset><fieldset><legend>Shelf footprint</legend><label>Furniture <select id="target"></select></label><div class="line"><label>X <input type="number" id="x" step="any"></label><label>Y <input type="number" id="y" step="any"></label></div><div class="line"><label>W <input type="number" id="w" step="any"></label><label>D <input type="number" id="d" step="any"></label></div><div class="line"><label>Front <select id="angle"><option value="0">South</option><option value="90">West</option><option value="180">North</option><option value="270">East</option></select></label></div><div class="line"><button id="set">Set exact geometry</button><button id="align">Align position</button></div><div class="line"><button id="add">Add Shelf</button><button id="remove">Remove empty sample</button></div></fieldset><p class="note">Plan depth is not frontal Shelf height. Numeric entry bypasses snapping. These are empty synthetic footprints; no contents, files or directories are changed.</p></section></main>
<footer><span id="status" role="status">Top-down plan · Arrange to adjust geometry.</span><button id="undo" disabled>Undo</button><button id="cancel" hidden>Cancel</button><button id="apply" hidden disabled>Apply</button></footer>
<script>
'use strict';
const $=id=>document.getElementById(id), svg=$('scene'), copy=o=>JSON.parse(JSON.stringify(o));
const themes={Twilight:['#121e23','#263c37','#8c6e5a','#91ada1','#e6e1d8'],Evening:['#343c43','#3f524f','#c2aa78','#b7a2c8','#f0f0e8'],Midnight:['#080f10','#101c1b','#869c9c','#568f80','#dadfd9']};
const initial={w:1000,d:680,next:7,shelves:[{id:1,name:'Manuscripts',x:60,y:54,w:260,d:92,a:0},{id:2,name:'Records',x:370,y:54,w:240,d:92,a:0},{id:3,name:'Collections',x:660,y:54,w:280,d:92,a:0},{id:4,name:'Observations',x:54,y:280,w:230,d:94,a:270},{id:5,name:'Reference',x:852,y:290,w:240,d:94,a:90},{id:6,name:'Atlases',x:360,y:338,w:280,d:110,a:180}]};
let saved=copy(initial),draft=null,trial=null,gesture=null,history=[],target=1,grid=true,snap=true,interval=20;
const active=()=>draft||saved, display=()=>trial||active(), norm=a=>((a%360)+360)%360;
function box(s){let turn=s.a%180!==0;return {x:s.x,y:s.y,w:turn?s.d:s.w,h:turn?s.w:s.d}}
function valid(m){if(!Number.isFinite(m.w)||!Number.isFinite(m.d)||m.w<320||m.w>1800||m.d<240||m.d>1300)return 'Room range: width 320–1800, depth 240–1300.';if(m.shelves.length>24)return 'Study limit: 24 footprints.';for(const s of m.shelves){if(![s.x,s.y,s.w,s.d].every(Number.isFinite)||s.w<70||s.d<40||s.w>900||s.d>400||![0,90,180,270].includes(s.a))return 'Shelf width 70–900, depth 40–400; quarter turns only.';const b=box(s);if(b.x<0||b.y<0||b.x+b.w>m.w+.00001||b.y+b.h>m.d+.00001)return s.name+' crosses a room wall.'}for(let i=0;i<m.shelves.length;i++)for(let j=i+1;j<m.shelves.length;j++){let a=box(m.shelves[i]),b=box(m.shelves[j]);if(a.x<b.x+b.w-.00001&&b.x<a.x+a.w-.00001&&a.y<b.y+b.h-.00001&&b.y<a.y+a.h-.00001)return m.shelves[i].name+' overlaps '+m.shelves[j].name+'.'}return ''}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));const fmt=v=>String(Math.round(v*100)/100);const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function message(s,error=false){$('status').textContent=s;$('status').classList.toggle('error',error)}
function dims(x1,y1,x2,y2,label){const mx=(x1+x2)/2,my=(y1+y2)/2,vertical=x1===x2;return `<g fill="none" stroke="var(--etch)" stroke-opacity=".62" stroke-width="1"><path d="M${x1} ${y1}L${x2} ${y2}"/><path d="M${x1-4} ${y1+4}l8 -8M${x2-4} ${y2+4}l8 -8"/></g><text class="dim" x="${mx+(vertical?-13:0)}" y="${my+(vertical?0:-7)}" text-anchor="middle" ${vertical?`transform="rotate(-90 ${mx-13} ${my})"`:''}>${label}</text>`}
function render(){let m=display(),err=valid(m),arr=!!draft;let v=gesture?.view||[-85,-80,Math.max(active().w, m.w)+170,Math.max(active().d,m.d)+165];svg.setAttribute('viewBox',v.join(' '));let out=`<defs><pattern id="planGrid" width="${interval}" height="${interval}" patternUnits="userSpaceOnUse"><path d="M${interval} 0H0V${interval}" fill="none" stroke="var(--etch)" stroke-opacity=".15" stroke-width=".8"/></pattern><pattern id="wallHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V8" stroke="var(--etch)" stroke-opacity=".22" stroke-width="2"/></pattern></defs>`;
// Walls are a rectangular architectural section, not furniture or a separate room model.
out+=`<rect x="-14" y="-14" width="${m.w+28}" height="${m.d+28}" fill="var(--panel)" stroke="var(--metal)" stroke-width="1.5"/><rect x="-14" y="-14" width="${m.w+28}" height="${m.d+28}" fill="url(#wallHatch)"/><rect x="0" y="0" width="${m.w}" height="${m.d}" fill="var(--bg)" stroke="${err&&gesture?.kind==='room'?'var(--error)':'var(--etch)'}" stroke-width="1.5"/>`;
if(arr&&grid)out+=`<rect width="${m.w}" height="${m.d}" fill="url(#planGrid)"/>`;
// Door indication only. A real wall/opening editor and aisle policy are deferred.
const door=m.w/2-44;out+=`<path d="M${door} ${m.d}h88v14h-88Z" fill="var(--bg)"/><path d="M${door} ${m.d+14}v-14m88 14v-14M${door} ${m.d}v-88a88 88 0 0 1 88 88" stroke="var(--etch)" stroke-width="1" stroke-opacity=".6" fill="none"/>`;
out+=dims(0,-39,m.w,-39,fmt(m.w))+dims(-39,0,-39,m.d,fmt(m.d));
out+=`<text x="${m.w/2}" y="-58" text-anchor="middle" class="draftLabel">ROOM PLAN · WIDTH × DEPTH</text>`;
for(const s of m.shelves){let b=box(s),cx=b.x+b.w/2,cy=b.y+b.h/2,bad=!!err&&(!gesture||gesture.id===s.id),stroke=bad?'var(--error)':'var(--etch)',w=s.w,d=s.d;
// Local front is +Y; rotation changes world footprint. No inner file silhouettes.
out+=`<g transform="translate(${cx} ${cy}) rotate(${s.a})"><rect class="${arr?'move':''}" data-move="${s.id}" x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" rx="1" fill="var(--panel)" stroke="${stroke}" stroke-width="${bad?2.3:1.4}"/><rect x="${-w/2+5}" y="${-d/2+5}" width="${w-10}" height="${d-10}" fill="none" stroke="var(--metal)" stroke-width=".8" pointer-events="none"/><path d="M${-w/2+5} ${-d/2+10}H${w/2-5}M${-w/2+5} ${d/2-9}H${w/2-5}" stroke="var(--etch)" stroke-width="1" stroke-opacity=".75" pointer-events="none"/><path d="M${-w/2} ${d/2}H${w/2}" stroke="var(--etch)" stroke-width="3.5" pointer-events="none"/><path d="M-9 ${d/2+8}L0 ${d/2+15}L9 ${d/2+8}" fill="none" stroke="var(--etch)" stroke-width="1.1" pointer-events="none"/></g>`;
out+=`<text class="shelfLabel" x="${cx}" y="${cy-3}" text-anchor="middle">${esc(s.name)}</text><text class="shelfNo" x="${cx}" y="${cy+13}" text-anchor="middle">${fmt(w)} × ${fmt(d)}</text>`;
if(arr){out+=`<rect data-resize="${s.id}" class="resize" x="${b.x+b.w-8}" y="${b.y+b.h-8}" width="16" height="16" fill="var(--bg)" stroke="${stroke}" stroke-width="1.5"/><path d="M${b.x+b.w-5} ${b.y+b.h+4}l9 -9m-5 9l5 -5" stroke="${stroke}" pointer-events="none"/><circle data-turn="${s.id}" class="turn" cx="${b.x+9}" cy="${b.y+9}" r="8" fill="var(--bg)" stroke="${stroke}"/><path d="M${b.x+5} ${b.y+10}a4 4 0 1 1 6 2l2 -3m-2 3l-3 -1" fill="none" stroke="${stroke}" pointer-events="none"/>`}}
if(arr)out+=`<rect data-room="1" class="roomsize" x="${m.w+4}" y="${m.d+4}" width="18" height="18" fill="var(--bg)" stroke="${err?'var(--error)':'var(--etch)'}" stroke-width="1.6"/><path d="M${m.w+8} ${m.d+18}l10 -10m-6 10l6 -6" stroke="var(--etch)" pointer-events="none"/>`;
out+=`<g transform="translate(${m.w-18} ${m.d+49})"><path d="M-100 0H0M-100 -4V4M-50 -4V4M0 -4V4" stroke="var(--etch)" fill="none"/><text class="dim" x="-50" y="-8" text-anchor="middle">100 units</text></g><g transform="translate(10 ${m.d+44})" stroke="var(--etch)" fill="none"><path d="M0 15V-14L-5 -4L0 -8L5 -4Z"/><text x="12" y="5" class="dim">N</text></g>`;
svg.innerHTML=out;$('mode').textContent=arr?'Browse':'Arrange';$('mode').setAttribute('aria-pressed',String(arr));$('geometry').hidden=!arr;$('cancel').hidden=!arr;$('apply').hidden=!arr;$('apply').disabled=!arr||!!err||same(draft,saved)||!!gesture;$('undo').disabled=arr||!history.length;if(err)message(err,true);}
function fill(){const m=active();$('roomW').value=m.w;$('roomD').value=m.d;if(!m.shelves.some(s=>s.id===target))target=m.shelves[0]?.id??null;$('target').innerHTML=m.shelves.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');$('target').value=target;const s=m.shelves.find(s=>s.id===target);for(const k of ['x','y','w','d','angle']){$(k).disabled=!s;$(k).value=s?(k==='angle'?s.a:s[k]):''}for(const k of ['set','align','remove'])$(k).disabled=!s;}
function stage(m,success='Draft updated. Apply or Cancel.'){let err=valid(m);if(err){message(err,true);return false}draft=m;trial=null;render();fill();message(success);return true}
function start(){draft=copy(saved);render();fill();message('Drag footprints; square handle resizes, circular handle turns.')}
function end(apply){if(gesture)return;if(apply){if(valid(draft))return;history.push(copy(saved));saved=copy(draft)}draft=null;trial=null;$('panel').hidden=true;render();message(apply?'Plan applied.':'Arrangement cancelled.')}
$('mode').onclick=()=>{if(!draft)start();else if(same(draft,saved))end(false);else message('Apply or Cancel pending changes before leaving Arrange.',true)};
$('apply').onclick=()=>end(true);$('cancel').onclick=()=>end(false);$('undo').onclick=()=>{if(!draft&&history.length){saved=history.pop();render();message('Previous plan restored.')}};
$('geometry').onclick=()=>{$('panel').hidden=!$('panel').hidden;fill()};$('close').onclick=()=>{$('panel').hidden=true};$('side').onclick=()=>$('panel').classList.toggle('left');$('target').onchange=()=>{target=Number($('target').value);fill()};
$('theme').onchange=()=>{['bg','panel','metal','etch','text'].forEach((k,i)=>document.body.style.setProperty('--'+k,themes[$('theme').value][i]));document.body.style.background='var(--bg)';document.body.style.color='var(--text)'};
$('grid').onchange=()=>{grid=$('grid').checked;render()};$('snap').onchange=()=>{snap=$('snap').checked;render()};$('interval').onchange=()=>{let v=Number($('interval').value);if(Number.isInteger(v)&&v>=1&&v<=100)interval=v;else $('interval').value=interval;render()};
function num(id){return $(id).value.trim()===''?NaN:Number($(id).value)}
$('roomSet').onclick=()=>{let m=copy(draft);m.w=num('roomW');m.d=num('roomD');stage(m)};
$('set').onclick=()=>{let m=copy(draft),s=m.shelves.find(s=>s.id===target);if(!s)return;Object.assign(s,{x:num('x'),y:num('y'),w:num('w'),d:num('d'),a:num('angle')});stage(m)};
$('align').onclick=()=>{let m=copy(draft),s=m.shelves.find(s=>s.id===target);if(!s)return;s.x=Math.round(s.x/interval)*interval;s.y=Math.round(s.y/interval)*interval;stage(m)};
$('add').onclick=()=>{let m=copy(draft),id=m.next,s={id,name:'Shelf '+id,x:0,y:0,w:180,d:75,a:0};if(m.shelves.length>=24){message('Study limit: 24 footprints.',true);return}for(let y=20;y+s.d<=m.d;y+=20)for(let x=20;x+s.w<=m.w;x+=20){s.x=x;s.y=y;let test=copy(m);test.shelves.push(copy(s));test.next++;if(!valid(test)){target=id;stage(test,'Empty sample Shelf added.');return}}message('No free position for the sample Shelf; enlarge the room or rearrange.',true)};
$('remove').onclick=()=>{let m=copy(draft);m.shelves=m.shelves.filter(s=>s.id!==target);stage(m,'Empty sample removed; no file operations.')};
function point(e,inverse){return new DOMPoint(e.clientX,e.clientY).matrixTransform(inverse)}function delta(n){return snap?Math.round(n/interval)*interval:Math.round(n*100)/100}
svg.addEventListener('pointerdown',e=>{if(!draft||gesture||e.button!==0)return;let el=e.target,kind=el.hasAttribute('data-move')?'move':el.hasAttribute('data-resize')?'resize':el.hasAttribute('data-turn')?'turn':el.hasAttribute('data-room')?'room':null;if(!kind)return;e.preventDefault();let id=Number(el.getAttribute('data-'+kind)),base=copy(draft);if(kind!=='room')target=id;if(kind==='turn'){let s=base.shelves.find(s=>s.id===id),b=box(s);s.a=norm(s.a+90);let nb=box(s);s.x=b.x+(b.w-nb.w)/2;s.y=b.y+(b.h-nb.h)/2;stage(base,'Shelf turned 90°.');return}let inv=svg.getScreenCTM().inverse();gesture={kind,id,base,inv,start:point(e,inv),view:svg.getAttribute('viewBox').split(' ').map(Number),pointer:e.pointerId};svg.setPointerCapture(e.pointerId);trial=copy(base)});
svg.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.pointer)return;let g=gesture,p=point(e,g.inv),dx=delta(p.x-g.start.x),dy=delta(p.y-g.start.y),m=copy(g.base);if(g.kind==='room'){m.w=Math.min(1800,Math.max(320,m.w+dx));m.d=Math.min(1300,Math.max(240,m.d+dy))}else{let s=m.shelves.find(s=>s.id===g.id);if(g.kind==='move'){s.x+=dx;s.y+=dy}else if(s.a%180===0){s.w=Math.max(70,s.w+dx);s.d=Math.max(40,s.d+dy)}else{s.w=Math.max(70,s.w+dy);s.d=Math.max(40,s.d+dx)}}trial=m;render();if(!valid(m))message(g.kind==='room'?`${fmt(m.w)} × ${fmt(m.d)} room`:g.kind==='resize'?'Resize footprint · release to stage.':'Move footprint · release to stage.')});
function release(e,cancel=false){if(!gesture||e.pointerId!==gesture.pointer)return;let m=trial,err=valid(m);gesture=null;trial=null;try{svg.releasePointerCapture(e.pointerId)}catch{}if(!cancel&&!err){stage(m)}else{render();fill();message(cancel?'Gesture cancelled.':err+' Previous geometry retained.',!cancel)}}svg.addEventListener('pointerup',e=>release(e));svg.addEventListener('pointercancel',e=>release(e,true));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(gesture){let p=gesture.pointer;release({pointerId:p},true)}else if(!$('panel').hidden)$('panel').hidden=true;else if(draft)end(false)}});
window.__roomStudy={snapshot:()=>copy(saved),draft:()=>copy(draft),preview:()=>copy(trial),validate:valid};render();
</script></body></html>
